<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelestiaSphere - Web Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type="text/javascript">
        var canvas = document.getElementById('canvas');

        function resizeCanvas() {
            var dpr = window.devicePixelRatio || 1;
            // Use getBoundingClientRect to find exactly how large the browser wants the canvas to be in CSS pixels.
            // This prevents any scrollbars or gaps that occur when using innerWidth/innerHeight incorrectly.
            var rect = canvas.getBoundingClientRect();
            var physicalW = Math.round(rect.width * dpr);
            var physicalH = Math.round(rect.height * dpr);

            // Physical framebuffer size for WebGL
            canvas.width  = physicalW;
            canvas.height = physicalH;

            // Tell Emscripten / GLFW about the new physical size at runtime.
            if (typeof Module !== 'undefined' && Module.setCanvasSize) {
                Module.setCanvasSize(physicalW, physicalH);
            }
        }

        // Resize immediately so the canvas has the right dimensions before
        // the WASM module reads them during initialisation.
        resizeCanvas();

        // Keep canvas in sync whenever the browser window changes size.
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('webglcontextlost', function(e) {
            alert('WebGL context lost. Please reload the page.');
            e.preventDefault();
        }, false);

        // Intercept F11 to handle fullscreen natively via browser API.
        // This prevents the C++ GLFW from handling it, which causes viewport offsets in WebGL.
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F11') {
                e.preventDefault();
                e.stopPropagation();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(function(err) {
                        console.log("Fullscreen error: " + err.message);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        }, true); // true = capture phase, runs before Emscripten canvas listeners

        var Module = {
            canvas: canvas,
            onRuntimeInitialized: function () {
                resizeCanvas();
            }
        };
    </script>
    <script src="CosmoSim3D.js"></script>
</body>
</html>
